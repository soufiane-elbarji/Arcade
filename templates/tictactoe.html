{% extends "layout.html" %}

{% block main %}
<div class="game-container">
    <h1>Tic-Tac-Toe</h1>
    
    <!-- Game Options -->
    <div id="game-options" class="game-options glass-effect">
        <h3>Select Game Mode</h3>
        <div class="options-group">
            <input type="radio" id="vs-bot" name="game-mode" value="bot" checked>
            <label for="vs-bot">Vs. Bot</label>

            <input type="radio" id="vs-friend" name="game-mode" value="friend">
            <label for="vs-friend">Vs. Friend</label>
        </div>
        <button id="start-game-btn" class="btn">Start Game</button>
    </div>

    <!-- Game Area (hidden by default) -->
    <div id="game-area" class="game-area">
        <div class="game-status" id="status-message"></div>
        <div id="tictactoe-board">
            <!-- Cells will be generated by JS -->
        </div>
        <button id="reset-btn" style="display: none;">Play Again</button>
    </div>
</div>

<script src="/static/tictactoe.js"></script>
{% endblock %}
